# 节点运行参数。threads 要写死，别让视觉把 CPU 占满拖慢音频。

camera_node:
  ros__parameters:
    fps: 30.0
    width: 640
    height: 480
    # 目录、视频、设备都空时用合成画面，只能测延迟，不能看表情准不准。
    image_dir: ""
    video_path: ""
    device_id: -1
    output_topic: "/camera/image_raw"

emotion_detector:
  ros__parameters:
    model_path: ""
    backend: "cpu"        # cpu 或 cuda
    threads: 1
    input_topic: "/camera/image_raw"
    output_topic: "/emotion_result"

latency_reporter:
  ros__parameters:
    report_period_s: 5.0
    min_samples: 10
