# 运行参数。线程数写死，别把 CPU 占满。

camera_node:
  ros__parameters:
    fps: 30.0
    width: 640
    height: 480
    # 都不填就用假画面，只能测延迟。
    image_dir: ""
    video_path: ""
    device_id: -1
    output_topic: "/camera/image_raw"

emotion_detector:
  ros__parameters:
    model_path: ""
    backend: "cpu"        # cpu 或 cuda
    threads: 1
    input_topic: "/camera/image_raw"
    output_topic: "/emotion_result"

latency_reporter:
  ros__parameters:
    report_period_s: 5.0
    min_samples: 10
